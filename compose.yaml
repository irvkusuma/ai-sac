
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: ai-sac-dev

    working_dir: /workspace

    user: "${PUID}:${PGID}"

    env_file:
      - .env

    environment:
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      JUPYTER_ENABLE_LAB: "yes"

    ports:
      - "127.0.0.1:8888:8888"

    volumes:
      - .:/workspace
      - ai-sac-venv:/opt/venv

    restart: unless-stopped

volumes:
  ai-sac-venv:
    name: ai-sac-venv
